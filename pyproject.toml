[project]
name = "adas-perception-eval"
version = "0.1.0"
description = "Slice-based ADAS perception evaluation with a validated mAP implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Kept out of the base install so the ingest and metric layers, which are the
# parts CI actually runs, need nothing heavier than the standard library.
infer = [
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "pillow>=10.0",
]
# The reference implementation the project's own mAP is checked against. It is a
# dependency of the test suite rather than of the pipeline: nothing in the
# measurement path may import it, or the comparison would be circular.
reference = [
    "pycocotools>=2.0.7",
]
report = [
    "jinja2>=3.1",
]
export = [
    "ultralytics>=8.3",
]
# The bidirectional traceability gate, imported rather than written a third
# time. It lives in the fault injection harness because that is where it was
# built and attacked; the virtual production cell imports the same thing.
#
# SOURCED FROM A LOCAL CHECKOUT below, not from the git tag, because v0.4.0 is
# not pushed yet. That is a temporary state and it is written down rather than
# left as a resolution failure for whoever clones this next: replace the
# [tool.uv.sources] entry with the tag and nothing else changes.
traceability = [
    "fault-injection-harness",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    # Claims a triggering condition from safety/triggering_conditions.yaml.
    # scripts/check_conditions.py reads these by parsing, and fails the build
    # if a condition has no test or a test names one that does not exist.
    "demonstrates(condition): links a test to a SOTIF triggering condition",
]

[tool.ruff]
line-length = 90
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ape"]

[tool.coverage.run]
branch = true
source = ["src/ape"]

[tool.uv.sources]
fault-injection-harness = { path = "../fault-injection-harness", editable = true }
